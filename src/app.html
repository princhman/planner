<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				var STORAGE_KEY = "planner:theme";
				var theme;
				try {
					theme = localStorage.getItem(STORAGE_KEY);
				} catch (e) {}
				var isDark =
					theme === "dark" ||
					(theme !== "light" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (isDark) document.documentElement.classList.add("dark");
			})();
		</script>
		<style>
			:root {
				color-scheme: light;
				--app-bg: #eef1f5;
				--app-panel: rgba(255, 255, 255, 0.72);
				--app-shadow: rgba(45, 62, 80, 0.14);
				--app-glow: rgba(125, 147, 255, 0.18);
				--app-warmth: rgba(255, 214, 153, 0.18);
				font-family:
					"SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
			}

			.dark {
				color-scheme: dark;
				--app-bg: #18191f;
				--app-panel: rgba(30, 32, 42, 0.72);
				--app-shadow: rgba(0, 0, 0, 0.4);
				--app-glow: rgba(90, 110, 210, 0.12);
				--app-warmth: rgba(190, 150, 90, 0.10);
			}

			html {
				min-height: 100%;
				background:
					radial-gradient(circle at top left, var(--app-glow), transparent 34%),
					radial-gradient(circle at 85% 18%, var(--app-warmth), transparent 26%),
					linear-gradient(180deg, #f7f8fb 0%, var(--app-bg) 48%, #e7ebf1 100%);
				background-color: var(--app-bg);
			}

			html.dark {
				background:
					radial-gradient(circle at top left, var(--app-glow), transparent 34%),
					radial-gradient(circle at 85% 18%, var(--app-warmth), transparent 26%),
					linear-gradient(180deg, #1e2028 0%, var(--app-bg) 48%, #141519 100%);
				background-color: var(--app-bg);
			}

			body {
				min-height: 100vh;
				margin: 0;
				background:
					linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 42%),
					radial-gradient(circle at top, rgba(255, 255, 255, 0.75), transparent 48%);
				background-attachment: fixed;
				color: #18212b;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
			}

			.dark body {
				background:
					linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 42%),
					radial-gradient(circle at top, rgba(255, 255, 255, 0.05), transparent 48%);
				color: #ededf0;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
			}

			body::before {
				content: "";
				position: fixed;
				inset: 0;
				pointer-events: none;
				background:
					linear-gradient(rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.14)),
					repeating-linear-gradient(
						0deg,
						transparent 0,
						transparent 3px,
						rgba(255, 255, 255, 0.08) 4px
					);
				opacity: 0.45;
				mix-blend-mode: soft-light;
			}

			.dark body::before {
				background:
					linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.02)),
					repeating-linear-gradient(
						0deg,
						transparent 0,
						transparent 3px,
						rgba(255, 255, 255, 0.02) 4px
					);
				opacity: 0.3;
			}

			#svelte,
			body > div {
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
