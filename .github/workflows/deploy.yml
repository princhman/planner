name: Verify and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck application
        run: bun run check

      - name: Validate Worker bundle
        run: bun run deploy:dry-run

      - name: Check generated Worker types
        run: bun run cf:types:check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex functions
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy
          secrets: |
            WORKOS_API_KEY
            PRIVATE_KEY
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Explain skipped Cloudflare deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN to the Production environment."
