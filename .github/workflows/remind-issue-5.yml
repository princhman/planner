name: Remind about Cloudflare cutover

on:
  schedule:
    # 09:00 Europe/London on 9 September 2026 is 08:00 UTC.
    - cron: "0 8 9 9 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Remind the issue assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then
            echo "One-time reminder date has passed."
            exit 0
          fi

          if [ "$(gh issue view 5 --json state --jq .state)" != "OPEN" ]; then
            echo "Issue #5 is already closed."
            exit 0
          fi

          gh issue comment 5 --body $'> *This was generated by AI during triage.*\n\n@princhman Reminder: please finish the Cloudflare CI cutover described in this issue. This reminder was scheduled for 09:00 Europe/London on 9 September 2026.'
